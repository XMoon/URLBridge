name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      PACKAGE_OUTPUT_DIR: ${{ runner.temp }}/urlbridge-packages
      RELEASE_TAG: ${{ github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'

      - name: Run tests
        run: make test

      - name: Run cross-platform builds
        run: make build-all

      - name: Create release bundles
        run: ./scripts/package-release.sh

      - name: Upload GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: urlbridge-packages-${{ github.ref_name }}
          path: ${{ env.PACKAGE_OUTPUT_DIR }}/*
          if-no-files-found: error

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" "$PACKAGE_OUTPUT_DIR"/* --clobber
